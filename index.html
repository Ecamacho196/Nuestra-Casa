<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Casa — Organización</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5B4470">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --paper:#FAF6FB;
    --paper-dim:#F1E7F5;
    --ink:#332B3D;
    --ink-soft:#6B5E78;
    --ink-faint:#9C8FA8;
    --lilac:#8B6FB3;
    --lilac-dim:#E7DCF2;
    --lilac-deep:#5B4470;
    --rose:#D98B96;
    --rose-dim:#F6E1E3;
    --gold:#D9A544;
    --gold-dim:#F5E7C9;
    --sage:#7C9B6F;
    --sage-dim:#E1EADB;
    --coral:#C05C5C;
    --coral-dim:#F3DEDE;
    --line:#E4D8ED;
    --white:#FFFDFB;
    --shadow:0 2px 10px rgba(139,111,179,.12);
    --panel-scrim:rgba(255,253,251,.72);
    --panel-scrim-photo:rgba(255,253,251,.30);
  }
  *{box-sizing:border-box;}
  #nc-root{
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:var(--paper);
    max-width:720px;
    margin:0 auto;
    padding:26px 18px 60px;
    line-height:1.5;
    font-size:15px;
  }
  .nc-header{margin-bottom:18px;}
  .nc-eyebrow{font-size:13px;color:var(--lilac);font-weight:600;margin:0 0 4px;}
  .nc-title{font-family:'Fraunces',serif;font-weight:600;font-size:29px;margin:0 0 6px;letter-spacing:-0.01em;color:var(--lilac-deep);}
  .nc-sub{font-size:13.5px;color:var(--ink-soft);margin:0;}

  .nc-tabs{display:flex;gap:0;margin:20px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .nc-tabs::-webkit-scrollbar{display:none;}
  .nc-tab{font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:500;color:var(--ink-soft);background:none;border:none;padding:9px 3px 11px;margin-right:16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex:none;}
  .nc-tab.active{color:var(--lilac-deep);border-bottom-color:var(--lilac);}

  .nc-panel{display:none;position:relative;border-radius:22px;overflow:hidden;isolation:isolate;}
  .nc-panel.active{display:block;}
  .nc-panel-bg{position:absolute;inset:-26px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.08);opacity:.5;z-index:0;transform:scale(1.12);transition:opacity .3s;}
  .nc-panel-bg.has-photo{opacity:.85;}
  .nc-panel-content{position:relative;z-index:1;background:var(--panel-scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:20px;padding:16px 14px 18px;transition:background .3s;}
  .nc-panel-content.has-bg-photo{background:var(--panel-scrim-photo);}

  .bg-resumen{background:radial-gradient(circle at 15% 20%, var(--lilac-dim), transparent 55%), radial-gradient(circle at 85% 75%, var(--rose-dim), transparent 55%), var(--paper);}
  .bg-calendario{background:radial-gradient(circle at 80% 15%, var(--rose-dim), transparent 55%), radial-gradient(circle at 15% 80%, var(--gold-dim), transparent 55%), var(--paper);}
  .bg-lista{background:radial-gradient(circle at 20% 75%, var(--sage-dim), transparent 55%), radial-gradient(circle at 80% 20%, var(--lilac-dim), transparent 55%), var(--paper);}
  .bg-finanzas{background:radial-gradient(circle at 75% 25%, var(--gold-dim), transparent 55%), radial-gradient(circle at 20% 80%, var(--rose-dim), transparent 55%), var(--paper);}
  .bg-proyectos{background:radial-gradient(circle at 25% 25%, var(--gold-dim), transparent 55%), radial-gradient(circle at 80% 80%, var(--sage-dim), transparent 55%), var(--paper);}
  .bg-tareas{background:radial-gradient(circle at 80% 25%, var(--lilac-dim), transparent 55%), radial-gradient(circle at 20% 80%, var(--sage-dim), transparent 55%), var(--paper);}
  .bg-fechas{background:radial-gradient(circle at 20% 20%, var(--rose-dim), transparent 55%), radial-gradient(circle at 80% 80%, var(--gold-dim), transparent 55%), var(--paper);}
  .bg-recuerdos{background:radial-gradient(circle at 50% 15%, var(--rose-dim), transparent 60%), radial-gradient(circle at 50% 90%, var(--lilac-dim), transparent 60%), var(--paper);}
  .bg-normas{background:radial-gradient(circle at 30% 70%, var(--lilac-dim), transparent 55%), radial-gradient(circle at 70% 20%, var(--gold-dim), transparent 55%), var(--paper);}

  .nc-bg-picker{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--ink-soft);}
  .nc-bg-picker select{font-family:'Work Sans',sans-serif;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink);max-width:200px;}

  .nc-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .nc-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .nc-card.clickable{cursor:pointer;transition:transform .12s;}
  .nc-card.clickable:hover{transform:translateY(-2px);border-color:var(--lilac);}
  .nc-home-btn{position:fixed;bottom:18px;right:18px;background:var(--lilac-deep);color:var(--white);border:none;border-radius:50%;width:52px;height:52px;font-size:20px;box-shadow:0 4px 14px rgba(91,68,112,.35);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;}
  .nc-quickadd-btn{right:auto;left:18px;background:var(--sage);}
  .nc-card-label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px;}
  .nc-card-value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0;color:var(--lilac-deep);}
  .nc-card-note{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;}
  .nc-resumen-block{margin-bottom:20px;}
  .nc-resumen-block h3{font-size:12.5px;font-weight:600;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;}
  .nc-mini-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);}
  .nc-mini-row:last-child{border-bottom:none;}

  .nc-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .nc-chart-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .nc-chart-title{font-size:12px;font-weight:600;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;}
  .nc-chart-box{position:relative;height:170px;}
  .nc-chart-box.wide{height:190px;}

  .nc-progress-wrap{margin-bottom:20px;}
  .nc-progress-label{font-size:13px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;}
  .nc-progress-bar{height:7px;background:var(--paper-dim);border-radius:4px;overflow:hidden;}
  .nc-progress-fill{height:100%;background:var(--lilac);border-radius:4px;transition:width .3s ease;}

  .nc-filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .nc-chip-btn{font-size:12.5px;font-family:'Work Sans',sans-serif;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);cursor:pointer;}
  .nc-chip-btn.active{background:var(--lilac-deep);color:var(--white);border-color:var(--lilac-deep);}

  .nc-cat-manager{margin-bottom:16px;}
  .nc-cat-manager-label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px;}
  .nc-cat-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .nc-cat-chip{display:flex;align-items:center;gap:4px;background:var(--lilac-dim);border-radius:16px;padding:3px 4px 3px 10px;}
  .nc-cat-chip-input{border:none;background:none;font-family:'Work Sans',sans-serif;font-size:12.5px;color:var(--lilac-deep);width:auto;min-width:40px;max-width:130px;padding:2px;}
  .nc-cat-chip-input:focus{outline:none;}
  .nc-cat-chip-del{border:none;background:none;color:var(--lilac-deep);opacity:.55;cursor:pointer;font-size:14px;padding:0 6px;}
  .nc-cat-chip-del:hover{opacity:1;color:var(--coral);}
  .nc-cat-chip-add{border:1px dashed var(--lilac);background:none;color:var(--lilac-deep);border-radius:16px;padding:4px 12px;font-size:12.5px;cursor:pointer;}

  .nc-category{margin-bottom:24px;}
  .nc-cat-title{font-size:12px;font-weight:600;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 8px;}
  .nc-item-row{border-bottom:1px solid var(--line);padding:9px 0;}
  .nc-item-row:last-child{border-bottom:none;}
  .nc-item-top{display:flex;align-items:flex-start;gap:10px;}
  .nc-checkbox{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-faint);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .nc-checkbox.checked{background:var(--lilac);border-color:var(--lilac);}
  .nc-checkbox svg{width:12px;height:12px;stroke:var(--white);opacity:0;}
  .nc-checkbox.checked svg{opacity:1;}
  .nc-item-label{font-size:14.5px;cursor:pointer;flex:1;}
  .nc-item-label.done{color:var(--ink-soft);text-decoration:line-through;}
  .nc-item-cat-select{font-size:11.5px;border:none;background:none;color:var(--ink-faint);}
  .nc-item-del{flex:none;background:none;border:none;color:var(--line);cursor:pointer;font-size:16px;padding:0 4px;}
  .nc-item-del:hover{color:var(--coral);}
  .nc-purchase-box{margin:8px 0 2px 30px;background:var(--paper-dim);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .nc-purchase-box input, .nc-purchase-box select{font-family:'Work Sans',sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink);width:100%;}
  .nc-purchase-box .nc-full{grid-column:1/-1;}
  .nc-purchase-summary{margin:4px 0 0 30px;font-size:12.5px;color:var(--ink-soft);}

  .nc-add-row{display:flex;gap:8px;margin-top:10px;}
  .nc-add-input{flex:1;font-family:'Work Sans',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);}
  .nc-add-input:focus{outline:none;border-color:var(--lilac);}
  .nc-add-select{font-family:'Work Sans',sans-serif;font-size:13px;padding:8px 8px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);}
  .nc-add-btn{font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:500;padding:8px 14px;border:1px solid var(--lilac);border-radius:8px;background:var(--lilac-dim);color:var(--lilac-deep);cursor:pointer;white-space:nowrap;}
  .nc-add-btn:hover{background:var(--lilac);color:var(--white);}

  .nc-balance-card{background:var(--rose-dim);border:1px solid var(--rose);border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .nc-balance-title{font-size:12px;font-weight:600;color:#8A4A52;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;}
  .nc-balance-text{font-size:15px;margin:0;}
  .nc-filters{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:var(--shadow);}
  .nc-filters select, .nc-filters input{font-family:'Work Sans',sans-serif;font-size:12.5px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;}
  .nc-filters .nc-full{grid-column:1/-1;}

  .nc-expense-row{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
  .nc-expense-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .nc-expense-desc{font-size:14.5px;font-weight:500;}
  .nc-expense-amount{font-family:'Fraunces',serif;font-size:16px;font-weight:600;white-space:nowrap;color:var(--lilac-deep);}
  .nc-expense-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .nc-tag{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:500;}
  .nc-tag-exequiel{background:var(--lilac-dim);color:var(--lilac-deep);}
  .nc-tag-maru{background:var(--gold-dim);color:#8A6417;}
  .nc-tag-ambos{background:var(--sage-dim);color:#3F5C36;}
  .nc-tag-discutido{background:var(--sage-dim);color:#3F5C36;}
  .nc-tag-unilateral{background:var(--coral-dim);color:var(--coral);}
  .nc-tag-cat{background:var(--paper-dim);color:var(--ink-soft);}
  .nc-expense-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-faint);}
  .nc-expense-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;}
  .nc-expense-del:hover{color:var(--coral);}
  .nc-row-actions{display:flex;gap:8px;align-items:center;}
  .nc-edit-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;}
  .nc-edit-btn:hover{color:var(--lilac-deep);}
  .nc-cancel-link{background:none;border:none;color:var(--coral);font-size:12px;cursor:pointer;margin-left:10px;}
  .nc-split-note{font-size:12px;color:var(--ink-soft);margin:6px 0 0;}
  .nc-empty{font-size:13.5px;color:var(--ink-faint);padding:14px 0;text-align:center;}

  .nc-form-box{background:var(--paper-dim);border:1px dashed var(--lilac);border-radius:14px;padding:14px;margin-top:16px;}
  .nc-form-box .nc-form-title{font-size:12px;font-weight:600;color:var(--lilac-deep);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;}
  .nc-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .nc-form-grid .nc-full{grid-column:1/-1;}
  .nc-form-box input, .nc-form-box select, .nc-form-box textarea{font-family:'Work Sans',sans-serif;font-size:13.5px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);width:100%;}
  .nc-form-box textarea{resize:vertical;min-height:38px;}

  .nc-task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .nc-task-row:last-child{border-bottom:none;}
  .nc-task-text{font-size:14.5px;flex:1;}
  .nc-task-text.done{color:var(--ink-soft);text-decoration:line-through;}
  .nc-task-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}

  .nc-rem-row{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;box-shadow:var(--shadow);}
  .nc-rem-row.overdue{border-color:var(--coral);}
  .nc-rem-date{font-family:'Fraunces',serif;font-size:14px;font-weight:600;white-space:nowrap;color:var(--lilac-deep);}
  .nc-rem-date.overdue{color:var(--coral);}

  .nc-norms-intro{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .nc-norm-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .nc-norm-cat{font-size:11.5px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
  .nc-norm-text{font-size:14.5px;width:100%;border:none;background:none;resize:none;font-family:'Work Sans',sans-serif;color:var(--ink);line-height:1.5;padding:0;}
  .nc-norm-text:focus{outline:none;}
  .nc-norm-foot{display:flex;justify-content:flex-end;margin-top:6px;}
  .nc-norm-del{background:none;border:none;color:var(--line);font-size:12.5px;cursor:pointer;}
  .nc-norm-del:hover{color:var(--coral);}

  .nc-project-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .nc-project-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .nc-project-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;border:none;background:none;color:var(--lilac-deep);width:100%;padding:0;}
  .nc-project-title:focus{outline:none;}
  .nc-project-desc{font-size:13.5px;color:var(--ink-soft);border:none;background:none;width:100%;resize:none;font-family:'Work Sans',sans-serif;margin-top:4px;padding:0;}
  .nc-project-desc:focus{outline:none;}
  .nc-project-meta-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .nc-project-meta-row select, .nc-project-meta-row input{font-family:'Work Sans',sans-serif;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
  .nc-project-progress{margin-top:12px;}
  .nc-sub-list{margin-top:10px;}
  .nc-sub-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .nc-sub-text{font-size:13.5px;flex:1;}
  .nc-sub-text.done{color:var(--ink-soft);text-decoration:line-through;}
  .nc-sub-add{display:flex;gap:6px;margin-top:6px;}
  .nc-sub-add input{flex:1;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;}
  .nc-project-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12.5px;}
  .nc-project-del:hover{color:var(--coral);}

  .nc-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .nc-cal-nav{background:var(--lilac-dim);border:none;color:var(--lilac-deep);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;}
  .nc-cal-month{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--lilac-deep);text-transform:capitalize;}
  .nc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
  .nc-cal-dow{font-size:11px;color:var(--ink-faint);text-align:center;padding-bottom:4px;text-transform:uppercase;}
  .nc-cal-day{background:var(--white);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:4px;font-size:12px;cursor:pointer;position:relative;}
  .nc-cal-day.empty{background:none;border:none;cursor:default;}
  .nc-cal-day.today{border-color:var(--lilac);border-width:2px;}
  .nc-cal-day.selected{background:var(--lilac-dim);}
  .nc-cal-dots{display:flex;gap:2px;position:absolute;bottom:4px;left:4px;}
  .nc-cal-dot{width:5px;height:5px;border-radius:50%;}
  .nc-cal-detail{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px;}
  .nc-cal-detail h4{font-size:13px;color:var(--lilac-deep);margin:0 0 8px;}
  .nc-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-bottom:16px;flex-wrap:wrap;}
  .nc-legend span{display:inline-flex;align-items:center;gap:5px;}
  .nc-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .nc-mem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .nc-mem-card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .nc-mem-photo-wrap{width:100%;aspect-ratio:4/3;background:var(--paper-dim);overflow:hidden;}
  .nc-mem-photo{width:100%;height:100%;object-fit:cover;display:block;}
  .nc-mem-caption{font-size:13px;padding:8px 10px 2px;}
  .nc-mem-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);padding:4px 10px 10px;}

  .nc-status{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:22px;min-height:16px;}
  .nc-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--lilac-deep);color:var(--white);padding:10px 20px;border-radius:24px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(91,68,112,.35);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .nc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  button{font-family:'Work Sans',sans-serif;}

  .nc-love-counter{
    background:linear-gradient(135deg, var(--lilac-dim), var(--rose-dim));
    border:1px solid var(--rose);
    border-radius:18px;
    padding:18px 16px;
    margin:16px 0 4px;

  window.storage = {
    async get(key){
      const snap = await db.ref(FB_PATH + '/' + key).once('value');
      const val = snap.val();
      return (val === null || val === undefined) ? null : { key, value: val };
    },
    async set(key, value){
      await db.ref(FB_PATH + '/' + key).set(value);
      return { key, value };
    },
    async delete(key){
      await db.ref(FB_PATH + '/' + key).remove();
      return { key, deleted: true };
    },
    async list(prefix){
      const snap = await db.ref(FB_PATH).once('value');
      const all = snap.val() || {};
      const keys = Object.keys(all).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    }
  };

  function parseMonto(input){
    if(input==null) return 0;
    let s = String(input).trim();
    if(!s) return 0;
    s = s.replace(/[^0-9.,-]/g,'');
    const hasComma = s.includes(','), hasDot = s.includes('.');
    if(hasComma && hasDot){
      const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
      if(lastComma > lastDot) s = s.replace(/\./g,'').replace(',', '.');
      else s = s.replace(/,/g,'');
    } else if(hasComma){ s = s.replace(',', '.'); }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function exportGastosCSV(list){
    const header = ['Fecha','Descripcion','Categoria','Monto','QuienPago','Metodo','Cuotas','Discutido','Nota'];

    const csv = [header].concat(rows).map(r=>r.map(csvEscape).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'gastos-nuestra-casa-'+todayIso()+'.csv';

  function icsForReminder(r){
    const dt = (r.fecha||'').replace(/-/g,'');
    if(!dt) return null;
    const uid = r.id + '@nuestra-casa';
    const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const esc = s => String(s||'').replace(/\n/g,' ').replace(/,/g,'\\,');
    return [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NuestraCasa//ES',
      'BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+dt,
      'SUMMARY:'+esc(r.texto),'DESCRIPTION:'+esc(r.nota||''),
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');

  function resizeImage(file, maxWidth, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    const sel = container.querySelector(`[data-bgtab="${tabKey}"]`);
    if(!sel) return;
    sel.addEventListener('change', ()=>{
      fondosPorTab[tabKey] = sel.value;
      saveKey('fondos-tabs', fondosPorTab);
      applyPanelBg(tabKey);
    });
  }
  async function applyPanelBg(tabKey){
    const bgDiv = document.getElementById('bg-'+tabKey);
    if(!bgDiv) return;
    const contentDiv = document.getElementById('content-'+tabKey);
    const picked = fondosPorTab[tabKey];
    if(picked){
      const data = await getPhoto(picked);
      if(data){
        bgDiv.style.backgroundImage = `url(${data})`;
        bgDiv.classList.add('has-photo');
        if(contentDiv) contentDiv.classList.add('has-bg-photo');
        return;
      }
    }
    bgDiv.style.backgroundImage = '';
    bgDiv.classList.remove('has-photo');
    if(contentDiv) contentDiv.classList.remove('has-bg-photo');
  }

  function purchasesAsGastos(){ return Object.entries(purchases).map(([id,p])=>({ monto:p.monto, quien:p.quien, splitExequiel:p.splitEx })); }

  function getSettlementAdjustment(){
    // Positive = reduces how much Maru owes Exequiel (or increases how much Exequiel owes Maru)
    let adj = 0;
    ajustesSaldo.forEach(a=>{
      const m = Number(a.monto)||0;
      if(a.de==='Maru' && a.para==='Exequiel') adj += m;
      else if(a.de==='Exequiel' && a.para==='Maru') adj -= m;
    });
    return adj;
  }
  function renderBalanceHtml(list){
    let ex=0, mr=0, total=0;
    list.forEach(g=>{ const c=getContribution(g); total+=c.ex+c.mr; ex+=c.ex; mr+=c.mr; });
    if(total===0 && !ajustesSaldo.length) return `<div class="nc-balance-card"><p class="nc-balance-title">Balance</p><p class="nc-balance-text">Todavía no hay gastos registrados para calcular el balance.</p></div>`;
    const half = total/2;
    const rawDiff = ex - half;
    const settlementAdj = getSettlementAdjustment();
    const diff = rawDiff - settlementAdj;
    let text;
    if(Math.abs(diff) < 1) text = 'Están a la par — cada uno puso lo que le corresponde.';
    else if(diff > 0) text = `Maru le debe a Exequiel <strong>${money(diff)}</strong> para quedar a la par.`;
    else text = `Exequiel le debe a Maru <strong>${money(Math.abs(diff))}</strong> para quedar a la par.`;
    const ajusteNote = ajustesSaldo.length ? `<p class="nc-card-note">Ya se registraron ${money(Math.abs(settlementAdj))} en pagos entre ustedes para saldar cuentas.</p>` : '';
    return `<div class="nc-balance-card"><p class="nc-balance-title">Balance</p><p class="nc-balance-text">${text}</p><p class="nc-card-note">Exequiel puso ${money(ex)} · Maru puso ${money(mr)} · Total gastado ${money(total)}</p>${ajusteNote}</div>`;
  }
  function renderBalancePorMetodo(list){
    const metodos = {};
    list.forEach(g=>{
      const met = g.metodo || 'Sin especificar';
      if(!metodos[met]) metodos[met] = {ex:0, mr:0, total:0};
      const c = getContribution(g);
      metodos[met].ex += c.ex; metodos[met].mr += c.mr; metodos[met].total += c.ex + c.mr;
    });
    const keys = Object.keys(metodos);
    if(!keys.length) return '';
    return `
      <div class="nc-metodo-breakdown">
        <p class="nc-form-title">Desglose por método de pago</p>
        ${keys.map(m=>`
          <div class="nc-metodo-row">
            <span class="nc-tag nc-tag-cat">${escapeHtml(m)}</span>
            <span class="nc-metodo-detail">${money(metodos[m].total)} total · Exequiel ${money(metodos[m].ex)} · Maru ${money(metodos[m].mr)}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ---------------- CALENDARIO ----------------
  function getEventsForMonth(year, month){
    const events = {};
    function add(dateIso, item){ if(!dateIso) return; if(!events[dateIso]) events[dateIso]=[]; events[dateIso].push(item); }
    tareas.filter(t=>t.fecha).forEach(t=>add(t.fecha, {tipo:'tarea', texto:t.texto, color: t.hecho ? '#7C9B6F' : '#8B6FB3', id:t.id, hecho:!!t.hecho}));
    recordatorios.forEach(r=>{ if(r.fecha) add(r.fecha, {tipo:'fecha', texto:r.texto, color:'#D98B96'}); });
    proyectos.forEach(p=>{ if(p.fechaObjetivo) add(p.fechaObjetivo, {tipo:'proyecto', texto:p.titulo, color:'#D9A544'}); });
    return events;
  }

  function renderCalendario(){
    const panel = document.getElementById('content-calendario');
    const {year, month} = calState;
    const events = getEventsForMonth(year, month);
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayStr = todayIso();

    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="nc-cal-day empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const evs = events[iso] || [];
      const isToday = iso===todayStr;
      const isSel = iso===calState.selected;
      cells += `
        <div class="nc-cal-day ${isToday?'today':''} ${isSel?'selected':''}" data-day="${iso}">
          ${d}
          <div class="nc-cal-dots">${evs.slice(0,3).map(e=>`<span class="nc-cal-dot" style="background:${e.color}"></span>`).join('')}</div>
        </div>
      `;
    }

    let detailHtml = '';
    if(calState.selected){
      const evs = events[calState.selected] || [];
      detailHtml = `
        <div class="nc-cal-detail">
          <h4>${fmtDate(calState.selected)}</h4>
          ${evs.length ? evs.map(e=>{
            if(e.tipo==='tarea'){
              return `<div class="nc-task-row" style="padding:6px 0;">
                <button class="nc-checkbox ${e.hecho?'checked':''}" data-caltid="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                <span class="nc-task-text ${e.hecho?'done':''}" style="flex:1;">${escapeHtml(e.texto)}</span>
                <span class="nc-tag nc-tag-cat">Tarea</span>
              </div>`;
            }
            return `<div class="nc-mini-row"><span>${escapeHtml(e.texto)}</span><span class="nc-tag nc-tag-cat">${e.tipo==='fecha'?'Fecha importante':'Proyecto'}</span></div>`;
          }).join('') : '<p class="nc-empty">Nada agendado este día.</p>'}
        </div>
      `;
    }

    let html = renderBgPicker('calendario');
    html += `
      <div class="nc-cal-head">
        <button class="nc-cal-nav" id="cal-prev">‹</button>
        <span class="nc-cal-month">${MESES[month]} ${year}</span>
        <button class="nc-cal-nav" id="cal-next">›</button>
      </div>
      <div class="nc-legend">
        <span><i style="background:#8B6FB3"></i> Tareas pendientes</span>
        <span><i style="background:#7C9B6F"></i> Tareas cumplidas</span>
        <span><i style="background:#D98B96"></i> Fechas importantes</span>
        <span><i style="background:#D9A544"></i> Proyectos</span>
      </div>
      <div class="nc-cal-grid">
        ${DOW.map(d=>`<div class="nc-cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      ${detailHtml}
    `;
    panel.innerHTML = html;
    bindBgPicker(panel, 'calendario'); applyPanelBg('calendario');

    document.getElementById('cal-prev').addEventListener('click', ()=>{ calState.month--; if(calState.month<0){calState.month=11;calState.year--;} renderCalendario(); });
    document.getElementById('cal-next').addEventListener('click', ()=>{ calState.month++; if(calState.month>11){calState.month=0;calState.year++;} renderCalendario(); });
    panel.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click', ()=>{
      const day = el.getAttribute('data-day');
      calState.selected = calState.selected===day ? null : day;
      renderCalendario();
    }));
    panel.querySelectorAll('[data-caltid]').forEach(btn=>btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-caltid');
      const t = tareas.find(x=>x.id===id);
      if(t) t.hecho = !t.hecho;
      renderCalendario(); renderTareas(); renderResumen();
      saveKey('tareas-list', tareas);
    }));
  }

  // ---------------- CATEGORY MANAGER (reusable) ----------------
  function renderCatManager(cats){
    return `
      <div class="nc-cat-manager">
        <p class="nc-cat-manager-label">Categorías (tocá el nombre para renombrar)</p>
        <div class="nc-cat-chips">
          ${cats.map(c=>`
            <span class="nc-cat-chip">

  function bindCatManager(panel, onRename, onDelete, onAdd){
    panel.querySelectorAll('.nc-cat-chip-input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const oldName = inp.getAttribute('data-catold');
        const newName = inp.value.trim();
        if(newName && newName!==oldName) onRename(oldName, newName);
      });
    });
    panel.querySelectorAll('.nc-cat-chip-del').forEach(btn=>{
      btn.addEventListener('click', ()=>onDelete(btn.getAttribute('data-catdelname')));
    });
    const addBtn = panel.querySelector('[data-catadd]');
    if(addBtn) addBtn.addEventListener('click', ()=>onAdd());

  // ---------------- LISTA PARA LA CASA ----------------
  function renderLista(){
    const panel = document.getElementById('content-lista');
    const items = allItems();
    const total = items.length;
    const done = items.filter(it=>checkedState[it.id]).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const gastoTotal = Object.values(purchases).reduce((s,p)=>s+Number(p.monto||0),0);

    let visibleItems = items;
    if(listaFilter==='pendientes') visibleItems = items.filter(it=>!checkedState[it.id]);
    if(listaFilter==='comprados') visibleItems = items.filter(it=>checkedState[it.id]);

    const cats = checklistCats.filter(c=>visibleItems.some(it=>it.cat===c));

    let html = renderBgPicker('lista');
    html += `
      <div class="nc-progress-wrap">
        <div class="nc-progress-label"><span>${done} de ${total} conseguidos · ${money(gastoTotal)} gastados</span><span>${pct}%</span></div>
        <div class="nc-progress-bar"><div class="nc-progress-fill" style="width:${pct}%"></div></div>
      </div>
      ${renderCatManager(checklistCats)}
      <div class="nc-filter-row">
        <button class="nc-chip-btn ${listaFilter==='todos'?'active':''}" data-lf="todos">Todos</button>
        <button class="nc-chip-btn ${listaFilter==='pendientes'?'active':''}" data-lf="pendientes">Pendientes</button>
        <button class="nc-chip-btn ${listaFilter==='comprados'?'active':''}" data-lf="comprados">Comprados</button>
      </div>
    `;

    if(!cats.length) html += `<p class="nc-empty">No hay ítems en este filtro.</p>`;

    cats.forEach(cat=>{
      html += `<div class="nc-category"><p class="nc-cat-title">${escapeHtml(cat)}</p>`;
      visibleItems.filter(it=>it.cat===cat).forEach(it=>{
        const checked = !!checkedState[it.id];
        const p = purchases[it.id] || {};
        html += `
          <div class="nc-item-row">
            <div class="nc-item-top">
              <button class="nc-checkbox ${checked?'checked':''}" data-id="${it.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <input class="nc-item-label ${checked?'done':''}" data-editlabel="${it.id}" value="${escapeHtml(it.label)}">
              <select class="nc-item-cat-select" data-movecat="${it.id}">
                ${checklistCats.map(c=>`<option value="${c}" ${c===it.cat?'selected':''}>${c}</option>`).join('')}
              </select>
              <button class="nc-item-del" data-delid="${it.id}" title="Quitar">×</button>
            </div>
            ${checked ? `
              <div class="nc-purchase-box">
                <input type="text" inputmode="decimal" placeholder="Monto $" data-pfield="monto" data-pid="${it.id}" value="${p.monto!=null&&p.monto!==''?p.monto:''}">
                <select data-pfield="quien" data-pid="${it.id}"><option value="">¿Quién pagó?</option>${PERSONAS.map(per=>`<option value="${per}" ${p.quien===per?'selected':''}>${per}</option>`).join('')}</select>
                <select data-pfield="metodo" data-pid="${it.id}"><option value="">Método de pago</option>${METODOS.map(m=>`<option value="${m}" ${p.metodo===m?'selected':''}>${m}</option>`).join('')}</select>
                <input type="date" data-pfield="fecha" data-pid="${it.id}" value="${p.fecha||''}">
                ${p.quien==='Ambos' ? `<input class="nc-full" type="text" inputmode="decimal" placeholder="¿Cuánto puso Exequiel? (resto: Maru)" data-pfield="splitEx" data-pid="${it.id}" value="${p.splitEx!=null&&p.splitEx!==''?p.splitEx:''}">` : ''}
                <select class="nc-full" data-pfield="discutido" data-pid="${it.id}"><option value="">¿Discutido o unilateral?</option><option value="si" ${p.discutido==='si'?'selected':''}>Discutido en pareja</option><option value="no" ${p.discutido==='no'?'selected':''}>Decisión unilateral</option></select>
              </div>
              ${(p.monto||p.quien) ? `<p class="nc-purchase-summary">${p.monto?money(p.monto):''} ${p.quien?'· pagó '+p.quien:''} ${p.metodo?'· '+p.metodo:''} ${p.fecha?'· '+fmtDate(p.fecha):''}${p.quien==='Ambos' ? ' · Exequiel '+money((p.splitEx!=null&&p.splitEx!=='')?p.splitEx:Number(p.monto||0)/2)+' / Maru '+money(Number(p.monto||0)-((p.splitEx!=null&&p.splitEx!=='')?Number(p.splitEx):Number(p.monto||0)/2)) : ''}</p>` : ''}
            ` : ''}
          </div>
        `;
      });
      html += `</div>`;
    });

    html += `
      <div class="nc-add-row" data-quickadd-target="lista">
        <input class="nc-add-input" id="nc-new-item" placeholder="Agregar otra cosa a la lista..." />

      </div>

    panel.innerHTML = html;
    bindBgPicker(panel, 'lista'); applyPanelBg('lista');

    bindCatManager(panel,
      (oldName, newName)=>{
        checklistCats = checklistCats.map(c=>c===oldName?newName:c);
        customItems.forEach(it=>{ if(it.cat===oldName) it.cat=newName; });
        DEFAULT_ITEMS.forEach(it=>{ if(it.cat===oldName) it.cat=newName; });
        renderLista();
        saveKey('checklist-cats', checklistCats); saveKey('checklist-custom', customItems);
      },
      (name)=>{
        if(!confirm('¿Eliminar la categoría "'+name+'"? Los ítems se pasan a "Otro".')) return;
        checklistCats = ensureOtro(checklistCats.filter(c=>c!==name));
        customItems.forEach(it=>{ if(it.cat===name) it.cat='Otro'; });
        DEFAULT_ITEMS.forEach(it=>{ if(it.cat===name) it.cat='Otro'; });
        renderLista();
        saveKey('checklist-cats', checklistCats); saveKey('checklist-custom', customItems);
      },
      ()=>{
        let n='Nueva categoría', i=2;
        while(checklistCats.includes(n)){ n='Nueva categoría '+i; i++; }
        checklistCats.push(n);
        renderLista();
        saveKey('checklist-cats', checklistCats);
      }
    );

    panel.querySelectorAll('.nc-chip-btn').forEach(b=>b.addEventListener('click', ()=>{ listaFilter = b.getAttribute('data-lf'); renderLista(); }));
    panel.querySelectorAll('.nc-checkbox').forEach(btn=>btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-id'); checkedState[id] = !checkedState[id];
      renderLista(); renderResumen(); saveKey('checklist-state', checkedState);
    }));
    panel.querySelectorAll('[data-editlabel]').forEach(inp=>inp.addEventListener('change', ()=>{
      const id = inp.getAttribute('data-editlabel');
      const item = customItems.find(it=>it.id===id) || DEFAULT_ITEMS.find(it=>it.id===id);
      if(item && inp.value.trim()) item.label = inp.value.trim();
      saveKey('checklist-custom', customItems);
    }));
    panel.querySelectorAll('[data-movecat]').forEach(sel=>sel.addEventListener('change', ()=>{
      const id = sel.getAttribute('data-movecat'); const newCat = sel.value;
      const item = customItems.find(it=>it.id===id) || DEFAULT_ITEMS.find(it=>it.id===id);
      if(item) item.cat = newCat;
      renderLista();
      saveKey('checklist-custom', customItems);
    }));
    panel.querySelectorAll('.nc-item-del').forEach(btn=>btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('¿Quitar este ítem de la lista?')) return;
      const id = btn.getAttribute('data-delid');
      customItems = customItems.filter(it=>it.id!==id);
      delete checkedState[id]; delete purchases[id];
      renderLista(); renderResumen();
      saveKey('checklist-custom', customItems); saveKey('checklist-state', checkedState); saveKey('checklist-purchases', purchases);
    }));
    panel.querySelectorAll('[data-pfield]').forEach(inp=>inp.addEventListener('change', ()=>{
      const id = inp.getAttribute('data-pid'); const field = inp.getAttribute('data-pfield');
      purchases[id] = purchases[id] || {};
      if(field==='monto' || field==='splitEx') purchases[id][field] = parseMonto(inp.value);
      else purchases[id][field] = inp.value;
      if(field==='quien'){ debouncedSave('checklist-purchases', purchases, 200); renderLista(); renderResumen(); return; }
      debouncedSave('checklist-purchases', purchases, 400); renderResumen();
    }));

    const addBtn = document.getElementById('nc-add-item-btn');
    const addInput = document.getElementById('nc-new-item');
    function addItem(){
      const val = addInput.value.trim(); if(!val) return;
      const cat = document.getElementById('nc-new-item-cat').value;
      customItems.push({id:genId(), cat, label:val, custom:true});
      addInput.value=''; renderLista(); saveKey('checklist-custom', customItems);
    }
    addBtn.addEventListener('click', addItem);
    addInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
  }

  // ---------------- FINANZAS ----------------
  function filteredGastos(){
    return gastos.filter(g=>{
      if(finFilters.cat && g.categoria!==finFilters.cat) return false;
      if(finFilters.persona && g.quien!==finFilters.persona) return false;
      if(finFilters.metodo && g.metodo!==finFilters.metodo) return false;
      if(finFilters.discutido && g.discutido!==finFilters.discutido) return false;
      if(finFilters.q && !(g.descripcion||'').toLowerCase().includes(finFilters.q.toLowerCase())) return false;
      return true;
    }).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  }

  function renderFinanzas(){
    const panel = document.getElementById('content-finanzas');
    const list = filteredGastos();
    const totalFiltrado = list.reduce((s,g)=>s+Number(g.monto||0),0);

    const catTotals = {}; gastos.forEach(g=>{ catTotals[g.categoria||'Otro']=(catTotals[g.categoria||'Otro']||0)+Number(g.monto||0); });
    const gastoListaTotal = Object.values(purchases).reduce((s,p)=>s+Number(p.monto||0),0);
    if(gastoListaTotal) catTotals['Equipamiento del hogar'] = (catTotals['Equipamiento del hogar']||0) + gastoListaTotal;

    const personaTotals = {Exequiel:0, Maru:0};
    gastos.forEach(g=>{ const c=getContribution(g); personaTotals.Exequiel+=c.ex; personaTotals.Maru+=c.mr; });
    Object.values(purchases).forEach(p=>{ const c=getContribution({monto:p.monto, quien:p.quien, splitExequiel:p.splitEx}); personaTotals.Exequiel+=c.ex; personaTotals.Maru+=c.mr; });

    let html = renderBgPicker('finanzas');
    const gastosCombinados = gastos.concat(purchasesAsGastos());
    html += renderBalanceHtml(gastosCombinados);
    html += renderBalancePorMetodo(gastosCombinados);

    html += `
      <div class="nc-settle-box">
        <p class="nc-form-title">🤝 Saldar cuentas</p>
        <p class="nc-card-note">Cuando uno le paga al otro en mano o por transferencia para quedar a la par, registralo acá — ajusta el balance sin tener que editar cada gasto.</p>
        ${ajustesSaldo.length ? ajustesSaldo.slice().reverse().map(a=>`
          <div class="nc-settle-row">
            <span>${escapeHtml(a.de)} → ${escapeHtml(a.para)} · ${fmtDate(a.fecha)}${a.nota?' · '+escapeHtml(a.nota):''}</span>
            <span>${money(a.monto)} <button class="nc-expense-del" data-delajuste="${a.id}">×</button></span>
          </div>
        `).join('') : ''}
        <div class="nc-form-grid" style="margin-top:10px;">
          <select id="naj-de">${PERSONAS.filter(p=>p!=='Ambos').map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
          <select id="naj-para">${PERSONAS.filter(p=>p!=='Ambos').slice().reverse().map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
          <input id="naj-monto" type="text" inputmode="decimal" placeholder="Monto $">
          <input id="naj-fecha" type="date" value="${todayIso()}">
          <textarea class="nc-full" id="naj-nota" placeholder="Nota (opcional)"></textarea>
        </div>
        <button class="nc-add-btn" id="naj-add-btn">Registrar pago</button>
      </div>
    `;

    const pendientesRec = getRecurrentesPendientes();
    if(pendientesRec.length){
      html += `
        <div class="nc-recurrentes-box">
          <p class="nc-form-title">🔁 Gastos recurrentes de este mes</p>
          ${pendientesRec.map(t=>`
            <div class="nc-rec-row">
              <span>${escapeHtml(t.descripcion)} <span class="nc-tag nc-tag-cat">${escapeHtml(t.categoria)}</span></span>
              <input type="text" inputmode="decimal" class="nc-rec-monto" data-recmonto="${t.id}" value="${t.monto}">
              <button class="nc-add-btn" data-recconfirm="${t.id}">Agregar este mes</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    html += `
      <div class="nc-chart-grid">
        <div class="nc-chart-card"><p class="nc-chart-title">Por categoría</p><div class="nc-chart-box"><canvas id="chart-gastos-cat"></canvas></div></div>
        <div class="nc-chart-card"><p class="nc-chart-title">Por persona (aporte real)</p><div class="nc-chart-box"><canvas id="chart-gastos-persona"></canvas></div></div>
        <div class="nc-chart-card" style="grid-column:1/-1;"><p class="nc-chart-title">Evolución mensual</p><div class="nc-chart-box wide"><canvas id="chart-gastos-mensual"></canvas></div></div>
      </div>
      ${renderCatManager(gastoCats)}
      <div class="nc-filters">
        <select id="ff-cat"><option value="">Categoría: todas</option>${gastoCats.map(c=>`<option value="${c}" ${finFilters.cat===c?'selected':''}>${c}</option>`).join('')}</select>
        <select id="ff-persona"><option value="">Quién pagó: todos</option>${PERSONAS.map(p=>`<option value="${p}" ${finFilters.persona===p?'selected':''}>${p}</option>`).join('')}</select>
        <select id="ff-metodo"><option value="">Método: todos</option>${METODOS.map(m=>`<option value="${m}" ${finFilters.metodo===m?'selected':''}>${m}</option>`).join('')}</select>
        <select id="ff-discutido"><option value="">Discutido/unilateral: todos</option><option value="si" ${finFilters.discutido==='si'?'selected':''}>Discutido</option><option value="no" ${finFilters.discutido==='no'?'selected':''}>Unilateral</option></select>
        <input class="nc-full" id="ff-q" placeholder="Buscar por descripción..." value="${escapeHtml(finFilters.q)}">
      </div>
      <p class="nc-card-note" style="margin-bottom:12px;">Mostrando ${list.length} gasto(s) · total ${money(totalFiltrado)} · <button class="nc-edit-btn" id="fin-export-csv">📊 Exportar CSV</button></p>
    `;

    if(!list.length) html += `<p class="nc-empty">No hay gastos que coincidan con el filtro.</p>`;
    else list.forEach(g=>{
      const c = getContribution(g);
      const showSplit = g.quien==='Ambos';
      html += `
        <div class="nc-expense-row">
          <div class="nc-expense-head"><span class="nc-expense-desc">${escapeHtml(g.descripcion)}</span><span class="nc-expense-amount">${money(g.monto)}</span></div>
          <div class="nc-expense-meta">
            <span class="nc-tag nc-tag-cat">${escapeHtml(g.categoria||'Otro')}</span>
            <span class="nc-tag ${personaTagClass(g.quien)}">${escapeHtml(g.quien||'—')}</span>
            <span class="nc-tag nc-tag-cat">${escapeHtml(g.metodo||'—')}${g.metodo==='Crédito' && g.cuotas ? ' · '+g.cuotas+' cuotas' : ''}</span>
            <span class="nc-tag ${g.discutido==='no'?'nc-tag-unilateral':'nc-tag-discutido'}">${g.discutido==='no'?'Unilateral':'Discutido'}</span>
          </div>
          ${showSplit ? `<p class="nc-split-note">Exequiel puso ${money(c.ex)} · Maru puso ${money(c.mr)}</p>` : ''}
          ${g.historial && g.historial.length ? `<details class="nc-historial"><summary>Historial (${g.historial.length})</summary>${g.historial.map(h=>`<div class="nc-mini-row"><span>${escapeHtml(h.accion)}${h.quien?' · '+escapeHtml(h.quien):''}</span><span>${new Date(h.ts).toLocaleString('es-AR')}</span></div>`).join('')}</details>` : ''}
          <div class="nc-expense-foot">
            <span>${fmtDate(g.fecha)}${g.nota ? ' · '+escapeHtml(g.nota) : ''}</span>
            <span class="nc-row-actions">
              <button class="nc-edit-btn" data-editg="${g.id}">✎ Editar</button>
              <button class="nc-expense-del" data-delg="${g.id}">Eliminar</button>
            </span>
          </div>
        </div>
      `;
    });

    const editing = gastos.find(g=>g.id===editingGastoId);
    const linkingTask = !editing ? tareas.find(t=>t.id===linkingTaskId) : null;
    html += `
      <div class="nc-form-box" data-quickadd-target="finanzas">
        <p class="nc-form-title">${editing ? 'Editar gasto' : 'Registrar un gasto'}</p>
        ${linkingTask ? `<p class="nc-card-note">Vinculando con la tarea "${escapeHtml(linkingTask.texto)}" — al guardar, la tarea queda marcada como hecha. <button class="nc-cancel-link" id="ng-unlink-btn" type="button">Cancelar vínculo</button></p>` : ''}
        <div class="nc-form-grid">
          <input class="nc-full" id="ng-desc" placeholder="Descripción (ej: supermercado, factura de luz)" value="${editing?escapeHtml(editing.descripcion):(linkingTask?escapeHtml(linkingTask.texto):'')}">
          <input id="ng-monto" type="text" inputmode="decimal" placeholder="Monto $ (acepta coma o punto)" value="${editing&&editing.monto!=null?editing.monto:''}">
          <input id="ng-fecha" type="date" value="${editing&&editing.fecha?editing.fecha:todayIso()}">
          <select id="ng-cat">${gastoCats.map(c=>`<option value="${c}" ${editing&&editing.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
          <select id="ng-quien">${PERSONAS.map(p=>`<option value="${p}" ${editing?(editing.quien===p?'selected':''):(p==='Ambos'?'selected':'')}>${p}</option>`).join('')}</select>
          <select id="ng-metodo">${METODOS.map(m=>`<option value="${m}" ${editing&&editing.metodo===m?'selected':''}>${m}</option>`).join('')}</select>
          <input id="ng-cuotas" type="number" placeholder="Cuotas (si es crédito)" value="${editing&&editing.cuotas?editing.cuotas:''}">
          <select id="ng-discutido"><option value="si" ${!editing||editing.discutido==='si'?'selected':''}>Discutido en pareja</option><option value="no" ${editing&&editing.discutido==='no'?'selected':''}>Decisión unilateral</option></select>
          <div class="nc-full" id="ng-split-wrap" style="display:${(editing?editing.quien==='Ambos':true)?'block':'none'};">
            <input id="ng-split" type="text" inputmode="decimal" placeholder="¿Cuánto puso Exequiel? (el resto es de Maru)" value="${editing&&editing.splitExequiel!=null?editing.splitExequiel:''}">
          </div>
          <textarea class="nc-full" id="ng-nota" placeholder="Nota (opcional)">${editing?escapeHtml(editing.nota||''):''}</textarea>
        </div>
        <button class="nc-add-btn" id="ng-add-btn">${editing?'Guardar cambios':'Agregar gasto'}</button>
        ${editing ? `<button class="nc-cancel-link" id="ng-cancel-btn">Cancelar edición</button>` : ''}
      </div>
      <div class="nc-form-box">
        <p class="nc-form-title">Gestionar gastos recurrentes (plantillas mensuales)</p>
        ${gastosRecurrentes.map(t=>`<div class="nc-mini-row"><span>${escapeHtml(t.descripcion)} · ${money(t.monto)} · ${escapeHtml(t.categoria)}</span><button class="nc-expense-del" data-delrec="${t.id}">Eliminar</button></div>`).join('') || '<p class="nc-empty">No hay gastos recurrentes configurados todavía.</p>'}
        <div class="nc-form-grid" style="margin-top:10px;">
          <input class="nc-full" id="nrec-desc" placeholder="Ej: Alquiler, Luz, Gas, Internet">
          <input id="nrec-monto" type="text" inputmode="decimal" placeholder="Monto habitual $">
          <select id="nrec-cat">${gastoCats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
          <select id="nrec-quien">${PERSONAS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
          <select id="nrec-metodo">${METODOS.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
        </div>
        <button class="nc-add-btn" id="nrec-add-btn">Agregar plantilla recurrente</button>
      </div>
    `;

    panel.innerHTML = html;
    bindBgPicker(panel, 'finanzas'); applyPanelBg('finanzas');

    destroyChart('chart-gastos-cat'); destroyChart('chart-gastos-persona');
    if(window.Chart){
      const catLabels = Object.keys(catTotals);
      chartRefs['chart-gastos-cat'] = new Chart(document.getElementById('chart-gastos-cat'), {
        type:'doughnut',
        data:{ labels: catLabels.length?catLabels:['Sin datos'], datasets:[{ data: catLabels.length?catLabels.map(c=>catTotals[c]):[1], backgroundColor:['#8B6FB3','#D98B96','#D9A544','#7C9B6F','#B69AC9','#E4A9B0','#C9B26A','#9FB58F'], borderWidth:0 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:10} } } } }
      });
      chartRefs['chart-gastos-persona'] = new Chart(document.getElementById('chart-gastos-persona'), {
        type:'bar',
        data:{ labels:['Exequiel','Maru'], datasets:[{ data:[personaTotals.Exequiel, personaTotals.Maru], backgroundColor:['#8B6FB3','#D9A544'], borderRadius:6 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ ticks:{ font:{size:10} } }, x:{ ticks:{ font:{size:10} } } } }
      });
      destroyChart('chart-gastos-mensual');
      const mesesTotals = {};
      gastosCombinados.forEach(g=>{ if(!g.fecha) return; const ym = g.fecha.slice(0,7); mesesTotals[ym] = (mesesTotals[ym]||0) + Number(g.monto||0); });
      const mesesKeys = Object.keys(mesesTotals).sort();
      const mesesLabels = mesesKeys.map(ym=>{ const [y,m] = ym.split('-'); return MESES[parseInt(m,10)-1].slice(0,3)+' '+y.slice(2); });
      chartRefs['chart-gastos-mensual'] = new Chart(document.getElementById('chart-gastos-mensual'), {
        type:'line',
        data:{ labels: mesesKeys.length?mesesLabels:['Sin datos'], datasets:[{ label:'Total gastado', data: mesesKeys.length?mesesKeys.map(k=>mesesTotals[k]):[0], borderColor:'#8B6FB3', backgroundColor:'rgba(139,111,179,.15)', fill:true, tension:.3 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ ticks:{ font:{size:10} } }, x:{ ticks:{ font:{size:10} } } } }
      });
    }

    bindCatManager(panel,
      (oldName, newName)=>{
        gastoCats = gastoCats.map(c=>c===oldName?newName:c);
        gastos.forEach(g=>{ if(g.categoria===oldName) g.categoria=newName; });
        renderFinanzas();
        saveKey('finanzas-cats', gastoCats); saveKey('finanzas-gastos', gastos);
      },
      (name)=>{
        if(!confirm('¿Eliminar la categoría "'+name+'"? Los gastos se pasan a "Otro".')) return;
        gastoCats = ensureOtro(gastoCats.filter(c=>c!==name));
        gastos.forEach(g=>{ if(g.categoria===name) g.categoria='Otro'; });
        renderFinanzas();
        saveKey('finanzas-cats', gastoCats); saveKey('finanzas-gastos', gastos);
      },
      ()=>{
        let n='Nueva categoría', i=2;
        while(gastoCats.includes(n)){ n='Nueva categoría '+i; i++; }
        gastoCats.push(n);
        renderFinanzas();
        saveKey('finanzas-cats', gastoCats);
      }
    );

    panel.querySelectorAll('[data-delajuste]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este pago registrado entre ustedes?')) return;
      ajustesSaldo = ajustesSaldo.filter(a=>a.id!==btn.getAttribute('data-delajuste'));
      renderFinanzas(); renderResumen();
      saveKey('finanzas-ajustes', ajustesSaldo);
    }));
    document.getElementById('naj-add-btn').addEventListener('click', ()=>{
      const de = document.getElementById('naj-de').value;
      const para = document.getElementById('naj-para').value;
      const monto = parseMonto(document.getElementById('naj-monto').value);
      if(!monto){ showStatus('Falta el monto'); return; }
      if(de===para){ showStatus('Quién paga y quién recibe no pueden ser la misma persona'); return; }
      ajustesSaldo.push({
        id:genId(), de, para, monto,
        fecha:document.getElementById('naj-fecha').value || todayIso(),
        nota:document.getElementById('naj-nota').value.trim()
      });
      renderFinanzas(); renderResumen();
      saveKey('finanzas-ajustes', ajustesSaldo);
    });

    ['ff-cat','ff-persona','ff-metodo','ff-discutido'].forEach(id=>{
      document.getElementById(id).addEventListener('change', (e)=>{
        const map = {'ff-cat':'cat','ff-persona':'persona','ff-metodo':'metodo','ff-discutido':'discutido'};
        finFilters[map[id]] = e.target.value; renderFinanzas();
      });
    });
    document.getElementById('ff-q').addEventListener('input', (e)=>{ finFilters.q = e.target.value; renderFinanzas(); });
    document.getElementById('fin-export-csv').addEventListener('click', ()=>{ exportGastosCSV(list); });

    const quienSel = document.getElementById('ng-quien');
    quienSel.addEventListener('change', ()=>{
      document.getElementById('ng-split-wrap').style.display = quienSel.value==='Ambos' ? 'block' : 'none';
    });

    panel.querySelectorAll('[data-editg]').forEach(btn=>btn.addEventListener('click', ()=>{
      editingGastoId = btn.getAttribute('data-editg');
      renderFinanzas();
    }));
    panel.querySelectorAll('[data-delg]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este gasto?')) return;
      const id = btn.getAttribute('data-delg'); gastos = gastos.filter(g=>g.id!==id);
      if(editingGastoId===id) editingGastoId=null;
      renderFinanzas(); renderResumen(); saveKey('finanzas-gastos', gastos);
    }));
    const cancelBtn = document.getElementById('ng-cancel-btn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingGastoId=null; renderFinanzas(); });
    const unlinkBtn = document.getElementById('ng-unlink-btn');
    if(unlinkBtn) unlinkBtn.addEventListener('click', ()=>{ linkingTaskId=null; renderFinanzas(); });

    panel.querySelectorAll('[data-recconfirm]').forEach(btn=>btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-recconfirm');
      const t = gastosRecurrentes.find(x=>x.id===id);
      if(!t) return;
      const montoInp = panel.querySelector(`[data-recmonto="${id}"]`);
      const monto = parseMonto(montoInp.value);
      gastos.push({
        id:genId(), descripcion:t.descripcion, monto, fecha:todayIso(), categoria:t.categoria,
        quien:t.quien, metodo:t.metodo, cuotas:'', discutido:'si', nota:'Generado desde recurrente',
        historial:[{ts:Date.now(), quien:getWhoAmI()||'—', accion:'Creado (recurrente)'}]
      });
      t.ultimoMesGenerado = currentYYYYMM();
      renderFinanzas(); renderResumen();
      saveKey('finanzas-gastos', gastos); saveKey('gastos-recurrentes', gastosRecurrentes);
    }));
    panel.querySelectorAll('[data-delrec]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar esta plantilla recurrente?')) return;
      gastosRecurrentes = gastosRecurrentes.filter(t=>t.id!==btn.getAttribute('data-delrec'));
      renderFinanzas();
      saveKey('gastos-recurrentes', gastosRecurrentes);
    }));
    document.getElementById('nrec-add-btn').addEventListener('click', ()=>{
      const desc = document.getElementById('nrec-desc').value.trim();
      const monto = parseMonto(document.getElementById('nrec-monto').value);
      if(!desc || !monto) return;
      gastosRecurrentes.push({
        id:genId(), descripcion:desc, monto, categoria:document.getElementById('nrec-cat').value,
        quien:document.getElementById('nrec-quien').value, metodo:document.getElementById('nrec-metodo').value,
        ultimoMesGenerado:null
      });
      renderFinanzas();
      saveKey('gastos-recurrentes', gastosRecurrentes);
    });

    document.getElementById('ng-add-btn').addEventListener('click', ()=>{
      const desc = document.getElementById('ng-desc').value.trim();
      const monto = parseMonto(document.getElementById('ng-monto').value);
      if(!desc || !monto){ showStatus('Falta descripción o monto'); return; }
      const quien = document.getElementById('ng-quien').value;
      const splitRaw = document.getElementById('ng-split').value;
      const data = {
        descripcion:desc, monto,
        fecha:document.getElementById('ng-fecha').value || todayIso(),
        categoria:document.getElementById('ng-cat').value,
        quien,
        metodo:document.getElementById('ng-metodo').value,
        cuotas:document.getElementById('ng-cuotas').value || '',
        discutido:document.getElementById('ng-discutido').value,
        nota:document.getElementById('ng-nota').value.trim(),
        splitExequiel: (quien==='Ambos' && splitRaw!=='') ? parseMonto(splitRaw) : undefined
      };
      if(editingGastoId){
        const idx = gastos.findIndex(g=>g.id===editingGastoId);
        if(idx!==-1){
          const historial = (gastos[idx].historial || []).concat([{ts:Date.now(), quien:getWhoAmI()||'—', accion:'Editado'}]);
          gastos[idx] = Object.assign({}, gastos[idx], data, {historial});
        }
        editingGastoId = null;
      } else {
        const newId = genId();
        gastos.push(Object.assign({id:newId, historial:[{ts:Date.now(), quien:getWhoAmI()||'—', accion:'Creado'}]}, data));
        if(linkingTaskId){
          const t = tareas.find(x=>x.id===linkingTaskId);
          if(t){ t.gastoId = newId; t.hecho = true; }
          saveKey('tareas-list', tareas);
          linkingTaskId = null;
        }
      }
      renderFinanzas(); renderResumen(); renderTareas(); saveKey('finanzas-gastos', gastos);
    });
  }
  // ---------------- PROYECTOS JUNTOS ----------------
  function renderProyectos(){
    const panel = document.getElementById('content-proyectos');
    let html = renderBgPicker('proyectos');
    if(!proyectos.length) html += `<p class="nc-empty">Todavía no armaron ningún proyecto juntos. Puede ser un viaje, ahorrar para algo, remodelar un ambiente...</p>`;

    proyectos.forEach(p=>{
      const subs = p.subtareas || [];
      const doneSubs = subs.filter(s=>s.hecho).length;
      const pct = subs.length ? Math.round(doneSubs/subs.length*100) : (p.progresoManual||0);
      const aportes = p.aportes || [];
      const totalAportado = aportes.reduce((s,a)=>s+Number(a.monto||0),0);
      const metaAhorro = Number(p.metaAhorro||0);
      const pctAhorro = metaAhorro ? Math.min(100, Math.round(totalAportado/metaAhorro*100)) : 0;
      html += `
        <div class="nc-project-card" data-pid="${p.id}">
          <div class="nc-project-head">
            <input class="nc-project-title" data-pfield="titulo" data-pid="${p.id}" value="${escapeHtml(p.titulo)}">
            <button class="nc-project-del" data-delproj="${p.id}">Eliminar</button>
          </div>
          <textarea class="nc-project-desc" data-pfield="descripcion" data-pid="${p.id}" rows="1">${escapeHtml(p.descripcion||'')}</textarea>
          <div class="nc-project-meta-row">
            <select data-pfield="estado" data-pid="${p.id}">${ESTADOS_PROYECTO.map(e=>`<option value="${e}" ${p.estado===e?'selected':''}>${e}</option>`).join('')}</select>
            <input type="date" data-pfield="fechaObjetivo" data-pid="${p.id}" value="${p.fechaObjetivo||''}">
            <input type="text" inputmode="decimal" data-pfield="metaAhorro" data-pid="${p.id}" placeholder="Meta de ahorro $ (opcional)" value="${p.metaAhorro||''}" style="width:150px;">
          </div>
          <div class="nc-project-progress">
            <div class="nc-progress-label"><span>${doneSubs}/${subs.length} pasos</span><span>${pct}%</span></div>
            <div class="nc-progress-bar"><div class="nc-progress-fill" style="width:${pct}%;background:var(--gold);"></div></div>
          </div>
          <div class="nc-sub-list">
            ${subs.map(s=>`
              <div class="nc-sub-row">
                <button class="nc-checkbox ${s.hecho?'checked':''}" data-subid="${s.id}" data-pid="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                <span class="nc-sub-text ${s.hecho?'done':''}">${escapeHtml(s.texto)}</span>
                <button class="nc-item-del" data-delsub="${s.id}" data-pid="${p.id}">×</button>
              </div>
            `).join('')}
          </div>
          <div class="nc-sub-add">
            <input placeholder="Agregar paso..." data-newsub="${p.id}">
            <button class="nc-add-btn" data-addsubbtn="${p.id}">+</button>
          </div>
          ${metaAhorro ? `
            <div class="nc-project-progress">
              <div class="nc-progress-label"><span>Ahorrado: ${money(totalAportado)} de ${money(metaAhorro)}</span><span>${pctAhorro}%</span></div>
              <div class="nc-progress-bar"><div class="nc-progress-fill" style="width:${pctAhorro}%;background:var(--sage);"></div></div>
            </div>
            <div class="nc-sub-list">
              ${aportes.map(a=>`<div class="nc-aporte-row"><span>${escapeHtml(a.quien)} · ${fmtDate(a.fecha)}</span><span>${money(a.monto)} <button class="nc-item-del" data-delaporte="${a.id}" data-pid="${p.id}">×</button></span></div>`).join('')}
            </div>
            <div class="nc-aporte-add">
              <input type="text" inputmode="decimal" placeholder="Monto $" data-newaportemonto="${p.id}">
              <select data-newaportequien="${p.id}">${PERSONAS.map(per=>`<option value="${per}">${per}</option>`).join('')}</select>
              <button class="nc-add-btn" data-addaportebtn="${p.id}">Agregar aporte</button>
            </div>
          ` : ''}
        </div>
      `;
    });

    html += `
      <div class="nc-form-box" data-quickadd-target="proyectos">
        <p class="nc-form-title">Nuevo proyecto juntos</p>
        <div class="nc-form-grid">
          <input class="nc-full" id="np-titulo" placeholder="Ej: viaje a Cafayate, ahorrar para el auto, decorar el living">
          <textarea class="nc-full" id="np-desc" placeholder="Descripción (opcional)"></textarea>
          <select id="np-estado">${ESTADOS_PROYECTO.map(e=>`<option value="${e}">${e}</option>`).join('')}</select>
          <input id="np-fecha" type="date">
        </div>
        <button class="nc-add-btn" id="np-add-btn">Crear proyecto</button>
      </div>
    `;

    panel.innerHTML = html;
    bindBgPicker(panel, 'proyectos'); applyPanelBg('proyectos');

    panel.querySelectorAll('[data-pfield]').forEach(el=>el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-pid'); const field = el.getAttribute('data-pfield');
      const p = proyectos.find(x=>x.id===id); if(!p) return;
      p[field] = (field==='metaAhorro') ? parseMonto(el.value) : el.value;
      renderProyectos(); renderResumen(); renderCalendario();
      saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-delproj]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este proyecto y todos sus pasos?')) return;
      proyectos = proyectos.filter(p=>p.id!==btn.getAttribute('data-delproj'));
      renderProyectos(); renderResumen(); renderCalendario();
      saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-subid]').forEach(btn=>btn.addEventListener('click', ()=>{
      const p = proyectos.find(x=>x.id===btn.getAttribute('data-pid'));
      const s = p && p.subtareas.find(x=>x.id===btn.getAttribute('data-subid'));
      if(s) s.hecho = !s.hecho;
      renderProyectos(); saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-delsub]').forEach(btn=>btn.addEventListener('click', ()=>{
      const p = proyectos.find(x=>x.id===btn.getAttribute('data-pid'));
      if(p) p.subtareas = p.subtareas.filter(s=>s.id!==btn.getAttribute('data-delsub'));
      renderProyectos(); saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-addsubbtn]').forEach(btn=>btn.addEventListener('click', ()=>{
      const pid = btn.getAttribute('data-addsubbtn');
      const input = panel.querySelector(`[data-newsub="${pid}"]`);
      const val = input.value.trim(); if(!val) return;
      const p = proyectos.find(x=>x.id===pid);
      p.subtareas = p.subtareas || [];
      p.subtareas.push({id:genId(), texto:val, hecho:false});
      input.value='';
      renderProyectos(); saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-delaporte]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este aporte?')) return;
      const p = proyectos.find(x=>x.id===btn.getAttribute('data-pid'));
      if(p) p.aportes = (p.aportes||[]).filter(a=>a.id!==btn.getAttribute('data-delaporte'));
      renderProyectos(); saveKey('proyectos-list', proyectos);
    }));
    panel.querySelectorAll('[data-addaportebtn]').forEach(btn=>btn.addEventListener('click', ()=>{
      const pid = btn.getAttribute('data-addaportebtn');
      const montoInp = panel.querySelector(`[data-newaportemonto="${pid}"]`);
      const quienSel = panel.querySelector(`[data-newaportequien="${pid}"]`);
      const monto = parseMonto(montoInp.value);
      if(!monto) return;
      const p = proyectos.find(x=>x.id===pid);
      p.aportes = p.aportes || [];
      p.aportes.push({id:genId(), monto, quien:quienSel.value, fecha:todayIso()});
      renderProyectos(); saveKey('proyectos-list', proyectos);
    }));
    document.getElementById('np-add-btn').addEventListener('click', ()=>{
      const titulo = document.getElementById('np-titulo').value.trim(); if(!titulo) return;
      proyectos.push({
        id:genId(), titulo, descripcion:document.getElementById('np-desc').value.trim(),
        estado:document.getElementById('np-estado').value, fechaObjetivo:document.getElementById('np-fecha').value,
        subtareas:[], aportes:[], metaAhorro:0
      });
      renderProyectos(); renderResumen(); renderCalendario();
      saveKey('proyectos-list', proyectos);
    });
  }
  // ---------------- TAREAS ----------------
  function renderTareas(){
    const panel = document.getElementById('content-tareas');
    const countFor = p => tareas.filter(t=>t.asignado===p).length;
    const ex = countFor('Exequiel'), mr = countFor('Maru'), am = countFor('Ambos');

    let list = tareas;
    if(tareasFilter.estado==='pendientes') list = list.filter(t=>!t.hecho);
    if(tareasFilter.estado==='hechas') list = list.filter(t=>t.hecho);
    if(tareasFilter.asignado) list = list.filter(t=>t.asignado===tareasFilter.asignado);

    let html = renderBgPicker('tareas');
    html += `
      <div class="nc-chart-grid">
        <div class="nc-chart-card" style="grid-column:1/-1;"><p class="nc-chart-title">Reparto de tareas entre los dos</p><div class="nc-chart-box wide"><canvas id="chart-tareas-bar"></canvas></div></div>
      </div>
      <div class="nc-filter-row">
        <button class="nc-chip-btn ${tareasFilter.estado==='todas'?'active':''}" data-tf-estado="todas">Todas</button>
        <button class="nc-chip-btn ${tareasFilter.estado==='pendientes'?'active':''}" data-tf-estado="pendientes">Pendientes</button>

    if(!list.length) html += `<p class="nc-empty">No hay tareas en este filtro.</p>`;
    list.forEach(t=>{

      html += `
        <div class="nc-task-row">
          <button class="nc-checkbox ${t.hecho?'checked':''}" data-tid="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
          <div style="flex:1;">
            <span class="nc-task-text ${t.hecho?'done':''}">${escapeHtml(t.texto)}</span>
            <div class="nc-task-meta">
              <span class="nc-tag ${personaTagClass(t.asignado)}">${escapeHtml(t.asignado)}</span>
              <span class="nc-tag nc-tag-cat">${escapeHtml(t.frecuencia)}</span>
              ${t.fecha ? `<span class="nc-tag nc-tag-cat">${fmtDate(t.fecha)}</span>` : ''}

            </div>
          </div>

            <button class="nc-item-del" data-deltask="${t.id}">×</button>
          </span>
        </div>
      `;
    });

    const editingT = tareas.find(t=>t.id===editingTaskId);
    html += `
      <div class="nc-form-box" data-quickadd-target="tareas">
        <p class="nc-form-title">${editingT ? 'Editar tarea' : 'Agregar tarea'}</p>
        <div class="nc-form-grid">
          <input class="nc-full" id="nt-texto" placeholder="Ej: lavar los platos, pagar el alquiler, hacer las compras" value="${editingT?escapeHtml(editingT.texto):''}">
          <select id="nt-asignado">${PERSONAS.map(p=>`<option value="${p}" ${editingT&&editingT.asignado===p?'selected':''}>${p}</option>`).join('')}</select>
          <select id="nt-frecuencia">${FRECUENCIAS.map(f=>`<option value="${f}" ${editingT&&editingT.frecuencia===f?'selected':''}>${f}</option>`).join('')}</select>
          <input id="nt-fecha" type="date" placeholder="Fecha (opcional)" value="${editingT&&editingT.fecha?editingT.fecha:''}">
        </div>
        <button class="nc-add-btn" id="nt-add-btn">${editingT?'Guardar cambios':'Agregar tarea'}</button>
        ${editingT ? `<button class="nc-cancel-link" id="nt-cancel-btn">Cancelar edición</button>` : ''}
      </div>
    `;

    panel.innerHTML = html;
    bindBgPicker(panel, 'tareas'); applyPanelBg('tareas');

    destroyChart('chart-tareas-bar');
    if(window.Chart){
      chartRefs['chart-tareas-bar'] = new Chart(document.getElementById('chart-tareas-bar'), {
        type:'bar',
        data:{ labels:['Exequiel','Maru','Ambos'], datasets:[{ label:'Tareas asignadas', data:[ex,mr,am], backgroundColor:['#8B6FB3','#D9A544','#7C9B6F'], borderRadius:6 }] },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ stepSize:1, font:{size:11} } }, y:{ ticks:{ font:{size:12} } } } }
      });

    panel.querySelectorAll('[data-tf-estado]').forEach(b=>b.addEventListener('click', ()=>{ tareasFilter.estado = b.getAttribute('data-tf-estado'); renderTareas(); }));
    panel.querySelectorAll('[data-tid]').forEach(btn=>btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-tid'); const t = tareas.find(x=>x.id===id); if(t) t.hecho=!t.hecho;

      linkingTaskId = btn.getAttribute('data-linktask');
      activateTab('finanzas');
