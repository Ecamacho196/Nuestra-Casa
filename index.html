      if(editingTaskId===id) editingTaskId=null;
      renderTareas(); renderResumen(); renderCalendario(); saveKey('tareas-list', tareas);
    }));
    const tCancel = document.getElementById('nt-cancel-btn');
    if(tCancel) tCancel.addEventListener('click', ()=>{ editingTaskId=null; renderTareas(); });

    document.getElementById('nt-add-btn').addEventListener('click', ()=>{
      const texto = document.getElementById('nt-texto').value.trim(); if(!texto) return;
      const data = { texto, asignado:document.getElementById('nt-asignado').value, frecuencia:document.getElementById('nt-frecuencia').value, fecha:document.getElementById('nt-fecha').value };
      if(editingTaskId){
        const idx = tareas.findIndex(t=>t.id===editingTaskId);
        if(idx!==-1) tareas[idx] = Object.assign({}, tareas[idx], data);
        editingTaskId = null;
      } else {
        tareas.push(Object.assign({id:genId(), hecho:false}, data));
      }
      renderTareas(); renderResumen(); renderCalendario(); saveKey('tareas-list', tareas);
    });
  }
  // ---------------- FECHAS IMPORTANTES ----------------
  function renderFechas(){
    const panel = document.getElementById('content-fechas');
    const list = recordatorios.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    let html = renderBgPicker('fechas');
    if(!list.length) html += `<p class="nc-empty">No hay fechas importantes todavía — turnos médicos, trámites, cumpleaños, aniversarios...</p>`;
    list.forEach(r=>{
      const overdue = r.fecha && r.fecha < todayIso();
      html += `
        <div class="nc-rem-row ${overdue?'overdue':''}">
          <div>
            <div class="nc-expense-meta" style="margin-bottom:6px;">
              <span class="nc-tag nc-tag-cat">${escapeHtml(r.tipo)}</span>
              <span class="nc-tag ${personaTagClass(r.persona)}">${escapeHtml(r.persona)}</span>
              ${r.recurrente ? `<span class="nc-tag nc-tag-cat">${escapeHtml(r.frecuencia||'Recurrente')}</span>` : ''}
            </div>
            <div>${escapeHtml(r.texto)}</div>
            ${r.nota ? `<div class="nc-card-note">${escapeHtml(r.nota)}</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div class="nc-rem-date ${overdue?'overdue':''}">${r.fecha?fmtDate(r.fecha):'sin fecha'}</div>
            <span class="nc-row-actions">
              ${r.fecha ? `<button class="nc-edit-btn" data-icsr="${r.id}" title="Agregar al calendario del celular">📅</button>` : ''}
              <button class="nc-edit-btn" data-editr="${r.id}">✎</button>
              <button class="nc-expense-del" data-delrem="${r.id}">Eliminar</button>
            </span>
          </div>
        </div>
      `;
    });

    const editingR = recordatorios.find(r=>r.id===editingRemId);
    html += `
      <div class="nc-form-box" data-quickadd-target="fechas">
        <p class="nc-form-title">${editingR ? 'Editar fecha importante' : 'Agregar fecha importante'}</p>
        <div class="nc-form-grid">
          <input class="nc-full" id="nr-texto" placeholder="Ej: turno con el dentista, vencimiento del alquiler, cumpleaños de mamá" value="${editingR?escapeHtml(editingR.texto):''}">
          <select id="nr-tipo">${TIPOS_RECORDATORIO.map(t=>`<option value="${t}" ${editingR&&editingR.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
          <select id="nr-persona">${PERSONAS.map(p=>`<option value="${p}" ${editingR&&editingR.persona===p?'selected':''}>${p}</option>`).join('')}</select>
          <input id="nr-fecha" type="date" value="${editingR&&editingR.fecha?editingR.fecha:''}">
          <select id="nr-recurrente"><option value="no" ${!editingR||!editingR.recurrente?'selected':''}>No se repite</option><option value="si" ${editingR&&editingR.recurrente?'selected':''}>Se repite</option></select>
          <select id="nr-frecuencia">${FRECUENCIAS.map(f=>`<option value="${f}" ${editingR&&editingR.frecuencia===f?'selected':''}>${f}</option>`).join('')}</select>
          <textarea class="nc-full" id="nr-nota" placeholder="Nota (opcional)">${editingR?escapeHtml(editingR.nota||''):''}</textarea>
        </div>
        <button class="nc-add-btn" id="nr-add-btn">${editingR?'Guardar cambios':'Agregar'}</button>
        ${editingR ? `<button class="nc-cancel-link" id="nr-cancel-btn">Cancelar edición</button>` : ''}
      </div>
    `;

    panel.innerHTML = html;
    bindBgPicker(panel, 'fechas'); applyPanelBg('fechas');

    panel.querySelectorAll('[data-icsr]').forEach(btn=>btn.addEventListener('click', ()=>{
      const r = recordatorios.find(x=>x.id===btn.getAttribute('data-icsr'));
      if(r) downloadIcs(r);
    }));
    panel.querySelectorAll('[data-editr]').forEach(btn=>btn.addEventListener('click', ()=>{
      editingRemId = btn.getAttribute('data-editr'); renderFechas();
    }));
    panel.querySelectorAll('[data-delrem]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar esta fecha importante?')) return;
      const id = btn.getAttribute('data-delrem');
      recordatorios = recordatorios.filter(r=>r.id!==id);
      if(editingRemId===id) editingRemId=null;
      renderFechas(); renderResumen(); renderCalendario(); saveKey('recordatorios-list', recordatorios);
    }));
    const rCancel = document.getElementById('nr-cancel-btn');
    if(rCancel) rCancel.addEventListener('click', ()=>{ editingRemId=null; renderFechas(); });

    document.getElementById('nr-add-btn').addEventListener('click', ()=>{
      const texto = document.getElementById('nr-texto').value.trim(); if(!texto) return;
      const data = {
        texto, tipo:document.getElementById('nr-tipo').value, persona:document.getElementById('nr-persona').value,
        fecha:document.getElementById('nr-fecha').value, recurrente:document.getElementById('nr-recurrente').value==='si',
        frecuencia:document.getElementById('nr-frecuencia').value, nota:document.getElementById('nr-nota').value.trim()
      };
      if(editingRemId){
        const idx = recordatorios.findIndex(r=>r.id===editingRemId);
        if(idx!==-1) recordatorios[idx] = Object.assign({}, recordatorios[idx], data);
        editingRemId = null;
      } else {
        recordatorios.push(Object.assign({id:genId()}, data));
      }
      renderFechas(); renderResumen(); renderCalendario(); saveKey('recordatorios-list', recordatorios);
    });
  }

    `;

    panel.innerHTML = html;
    bindBgPicker(panel, 'recuerdos'); applyPanelBg('recuerdos');

    sorted.forEach(r=>{
      getPhoto(r.id).then(data=>{
        const img = document.getElementById('mem-img-'+r.id);
        if(img && data) img.src = data;
      });
    });

    panel.querySelectorAll('[data-delmem]').forEach(btn=>btn.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar este recuerdo? La foto se borra también.')) return;
      const id = btn.getAttribute('data-delmem');
      recuerdos = recuerdos.filter(r=>r.id!==id);
      delete photoCache[id];
      try{ await window.storage.delete('recuerdo-foto-'+id, true); }catch(e){}
      let changedBg = false;
      Object.keys(fondosPorTab).forEach(k=>{ if(fondosPorTab[k]===id){ fondosPorTab[k]=''; changedBg=true; } });
      renderRecuerdos();
      saveKey('recuerdos-list', recuerdos);
      if(changedBg){ saveKey('fondos-tabs', fondosPorTab); TAB_KEYS.forEach(applyPanelBg); }
    }));

    document.getElementById('nm-add-btn').addEventListener('click', async ()=>{
      const fileInput = document.getElementById('nm-file');
      const file = fileInput.files[0];
      if(!file){ showStatus('Elegí una foto primero'); return; }
      showStatus('Guardando foto...');
      try{
        const dataUrl = await resizeImage(file, 900, 0.72);
        const id = genId();
        await window.storage.set('recuerdo-foto-'+id, dataUrl, true);
        photoCache[id] = dataUrl;
        recuerdos.push({ id, caption:document.getElementById('nm-caption').value.trim(), fecha:document.getElementById('nm-fecha').value });
        renderRecuerdos();
        saveKey('recuerdos-list', recuerdos);
      }catch(e){ showStatus('No se pudo guardar la foto'); }
    });
  }

  // ---------------- NORMAS ----------------
  function renderNormas(){
    const panel = document.getElementById('content-normas');
    let html = renderBgPicker('normas');
    html += `<p class="nc-norms-intro">Editen esto entre los dos. No es un contrato legal — es el acuerdo de base para que la convivencia funcione. Se puede volver a tocar cuando algo deje de servir.</p>`;
    norms.forEach(n=>{
      html += `
        <div class="nc-norm-card">
          <p class="nc-norm-cat">${escapeHtml(n.cat)}</p>
          <textarea class="nc-norm-text" data-normid="${n.id}" rows="2">${escapeHtml(n.text)}</textarea>
          <div class="nc-norm-foot"><button class="nc-norm-del" data-delnorm="${n.id}">Eliminar</button></div>
        </div>
      `;
    });
    html += `
      <div class="nc-form-box" data-quickadd-target="normas">
        <p class="nc-form-title">Agregar norma</p>
        <select id="nn-cat">${NORM_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <textarea id="nn-text" placeholder="Escriban una nueva norma..."></textarea>
        <button class="nc-add-btn" id="nn-add-btn">Agregar norma</button>
      </div>
    `;
    panel.innerHTML = html;
    bindBgPicker(panel, 'normas'); applyPanelBg('normas');

    panel.querySelectorAll('.nc-norm-text').forEach(ta=>{
      autoGrow(ta);
      ta.addEventListener('input', ()=>{
        autoGrow(ta);
        const id = ta.getAttribute('data-normid'); const n = norms.find(x=>x.id===id);
        if(n) n.text = ta.value;
        debouncedSave('convivencia-normas', norms, 600);
      });
    });
    panel.querySelectorAll('[data-delnorm]').forEach(btn=>btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar esta norma?')) return;
      norms = norms.filter(n=>n.id!==btn.getAttribute('data-delnorm'));
      renderNormas(); saveKey('convivencia-normas', norms);
    }));
    document.getElementById('nn-add-btn').addEventListener('click', ()=>{
      const text = document.getElementById('nn-text').value.trim(); if(!text) return;
      norms.push({id:genId(), cat:document.getElementById('nn-cat').value, text});
      renderNormas(); saveKey('convivencia-normas', norms);
    });
  }

  function autoGrow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight)+'px'; }

  function activateTab(which){
    root.querySelectorAll('.nc-tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')===which));
    root.querySelectorAll('.nc-panel').forEach(p=>p.classList.remove('active'));
    const panelEl = document.getElementById('nc-panel-'+which);
    if(panelEl) panelEl.classList.add('active');
    const homeBtn = document.getElementById('nc-home-btn');
    if(homeBtn) homeBtn.style.display = which==='resumen' ? 'none' : 'flex';
    const quickBtn = document.getElementById('nc-quickadd-btn');
    if(quickBtn) quickBtn.style.display = which==='resumen' ? 'none' : 'flex';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  root.querySelectorAll('.nc-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{ activateTab(tab.getAttribute('data-tab')); });
  });
  const homeBtnEl = document.getElementById('nc-home-btn');
  if(homeBtnEl) homeBtnEl.addEventListener('click', ()=>{ activateTab('resumen'); });
  const quickAddBtnEl = document.getElementById('nc-quickadd-btn');
  if(quickAddBtnEl) quickAddBtnEl.addEventListener('click', ()=>{
    const activePanel = root.querySelector('.nc-panel.active');
    if(!activePanel) return;
    const target = activePanel.querySelector('[data-quickadd-target]');
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    const firstField = target.querySelector('input, textarea, select');
    if(firstField) setTimeout(()=>firstField.focus(), 350);
  });

  function applyTheme(){
    const t = localStorage.getItem('nc-theme') || 'light';
    root.setAttribute('data-theme', t);
    const btn = document.getElementById('nc-theme-btn');
    if(btn) btn.textContent = t==='dark' ? '☀️ Modo claro' : '🌙 Modo oscuro';
  }
  const themeBtn = document.getElementById('nc-theme-btn');
  if(themeBtn) themeBtn.addEventListener('click', ()=>{
    const cur = localStorage.getItem('nc-theme') || 'light';
    localStorage.setItem('nc-theme', cur==='dark' ? 'light' : 'dark');
    applyTheme();
  });
  applyTheme();

  if(!getWhoAmI()){
    const banner = document.getElementById('nc-whoami-banner');
    if(banner) banner.style.display = 'flex';
  }
  document.querySelectorAll('[data-whoami]').forEach(btn=>btn.addEventListener('click', ()=>{
    localStorage.setItem('nc-whoami', btn.getAttribute('data-whoami'));
    const banner = document.getElementById('nc-whoami-banner');
    if(banner) banner.style.display = 'none';
  }));

  const refreshBtn = document.getElementById('nc-refresh-btn');
  if(refreshBtn) refreshBtn.addEventListener('click', async ()=>{
    const original = refreshBtn.textContent;
    refreshBtn.textContent = 'Actualizando...';
    refreshBtn.disabled = true;
    editingGastoId = null; editingTaskId = null; editingRemId = null;
    await loadAll();
    refreshBtn.textContent = 'Actualizado ✓';
    setTimeout(()=>{ refreshBtn.textContent = original; refreshBtn.disabled = false; }, 1400);
  });

  const ANIVERSARIO = new Date(2017, 8, 18, 0, 0, 0); // 18-09-2017
  function renderLoveCounter(){
    const el = document.getElementById('nc-love-counter');
    if(!el) return;
    const now = new Date();
    if(now < ANIVERSARIO){ el.style.display='none'; return; }

    let years = now.getFullYear() - ANIVERSARIO.getFullYear();
    let months = now.getMonth() - ANIVERSARIO.getMonth();
    let days = now.getDate() - ANIVERSARIO.getDate();
    let hours = now.getHours() - ANIVERSARIO.getHours();
    let minutes = now.getMinutes() - ANIVERSARIO.getMinutes();
    let seconds = now.getSeconds() - ANIVERSARIO.getSeconds();

    if(seconds < 0){ seconds += 60; minutes--; }
    if(minutes < 0){ minutes += 60; hours--; }
    if(hours < 0){ hours += 24; days--; }
    if(days < 0){
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
      months--;
    }
    if(months < 0){ months += 12; years--; }

    el.innerHTML = `
      <p class="nc-love-label">💗 Juntos desde el 18/09/2017</p>
      <div class="nc-love-grid">
        <div class="nc-love-unit"><span class="nc-love-num">${years}</span><span class="nc-love-word">Años</span></div>
        <div class="nc-love-unit"><span class="nc-love-num">${months}</span><span class="nc-love-word">Meses</span></div>
        <div class="nc-love-unit"><span class="nc-love-num">${days}</span><span class="nc-love-word">Días</span></div>
        <div class="nc-love-unit"><span class="nc-love-num">${hours}</span><span class="nc-love-word">Horas</span></div>
        <div class="nc-love-unit"><span class="nc-love-num">${minutes}</span><span class="nc-love-word">Minutos</span></div>
        <div class="nc-love-unit"><span class="nc-love-num">${seconds}</span><span class="nc-love-word">Segundos</span></div>
      </div>
      <p class="nc-love-sub">y contando... 💗</p>
    `;
  }
  renderLoveCounter();
  setInterval(renderLoveCounter, 1000);

  loadAll();
})();
</script>

<script>
(function(){
  const BACKUP_KEYS = ['checklist-state','checklist-custom','checklist-cats','checklist-purchases','finanzas-gastos','finanzas-cats','gastos-recurrentes','finanzas-ajustes','tareas-list','recordatorios-list','proyectos-list','convivencia-normas','recuerdos-list','fondos-tabs'];

  const btn = document.getElementById('nc-backup-btn');
  if(btn){
    const original = btn.textContent;
    btn.addEventListener('click', async function(){
      btn.disabled = true;
      btn.textContent = 'Preparando...';
      try{
        const backup = {};
        for(const k of BACKUP_KEYS){
          const r = await window.storage.get(k);
          backup[k] = r ? r.value : null;
        }
        let recList = [];
        try{ recList = backup['recuerdos-list'] ? JSON.parse(backup['recuerdos-list']) : []; }catch(e){}
        backup['fotos'] = {};
        for(const r of recList){
          const foto = await window.storage.get('recuerdo-foto-'+r.id);
          if(foto) backup['fotos']['recuerdo-foto-'+r.id] = foto.value;
        }
        const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date().toISOString().slice(0,10);
        a.href = url; a.download = 'backup-nuestra-casa-'+d+'.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        btn.textContent = 'Backup descargado ✓';
      }catch(e){
        btn.textContent = 'Error al hacer backup';
      }
      setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2200);
    });
  }

  const restoreBtn = document.getElementById('nc-restore-btn');
  const restoreFile = document.getElementById('nc-restore-file');
  if(restoreBtn && restoreFile){
    const originalR = restoreBtn.textContent;
    restoreBtn.addEventListener('click', ()=>{ restoreFile.click(); });
    restoreFile.addEventListener('change', async ()=>{
      const file = restoreFile.files[0];
      if(!file) return;
      if(!confirm('Esto va a REEMPLAZAR todo lo que hay ahora por lo que está en el backup. ¿Seguro que querés continuar?')) { restoreFile.value=''; return; }
      restoreBtn.disabled = true;
      restoreBtn.textContent = 'Restaurando...';
      try{
        const text = await file.text();
        const backup = JSON.parse(text);
        for(const k of BACKUP_KEYS){
          if(backup[k] !== undefined && backup[k] !== null){
            await window.storage.set(k, backup[k]);
          }
        }
        if(backup['fotos']){
          for(const fotoKey of Object.keys(backup['fotos'])){
            await window.storage.set(fotoKey, backup['fotos'][fotoKey]);
          }
        }
        restoreBtn.textContent = 'Restaurado ✓ recargando...';
        setTimeout(()=>{ location.reload(); }, 1200);
      }catch(e){
        restoreBtn.textContent = 'Error al restaurar';
        setTimeout(()=>{ restoreBtn.textContent = originalR; restoreBtn.disabled = false; }, 2200);
      }
      restoreFile.value = '';
    });
  }
})();
</script>
